<template id="sidebar-toggle">
    <style>
        #sidebar {
            display: inline-flex;
            align-items: center;
        }

        .sidebar-toggle {
            --button-size: 24px;

            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: var(--button-size);
            height: var(--button-size);
            margin: 0 4px 0 0;
            padding: 0;
            border: 0;
            background: transparent;
            font-size: calc(var(--button-size) * 0.8);
            line-height: 0;
            cursor: pointer;
            user-select: none;
            color: var(--background-color);
        }
    </style>
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-pressed="true" aria-label="Sidebar">
        <span class="sidebar-toggle-icon" aria-hidden="true">&#x25E8;</span>
    </button>
</template>
