<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Jonathan William Tsang is a user experience and accessibility focused front-end developer with 10+ years of profession experience." />
  <meta name="theme-color" content="#1e1e1e" />

  <base href="%BASE_URL%" />
  <link rel="icon" href="%BASE_URL%favicon.ico" />
  <link rel="apple-touch-icon" href="%BASE_URL%logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <link rel="stylesheet" href="src/styles/themes.css" />
  <script src="%BASE_URL%coi-serviceworker.js"></script>
  <script type="module" src="src/init.js"></script>
  <script type="module" src="src/index.tsx"></script>
  <title>Senior Frontend Developer with Fullstack Experience - Jonathan Tsang</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    @media (prefers-reduced-motion: no-preference) {
      html.animation {
        transition-duration: 150ms;
        transition-property: background-color, border-radius, border-color, color;
        transition-timing-function: ease-in-out;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    html {
      background-color: var(--background-color);
      color: var(--text-color);
    }

    body {
      position: relative;
      background-color: var(--background-color);
      color: var(--text-color);
      font-family: Consolas, "Courier New", Menlo, Monaco, "Liberation Mono", "Lucida Console", monospace;
      font-size: 16px;
      font-kerning: normal;
      font-variant-ligatures: none;

      text-shadow: var(--text-glow);
      text-wrap: pretty;
      word-break: break-word;
      text-rendering: optimizeLegibility;

      transform: translateZ(0);

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -moz-font-smoothing: antialiased;
      font-feature-settings: "kern" 1, "liga" 0;
      -webkit-font-feature-settings: "kern" 1, "liga" 0;
      -moz-font-feature-settings: "kern" 1, "liga" 0;
      font-smooth: always;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: inherit;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes crtTurnOn {
        0% {
          transform: scaleX(0) scaleY(0);
        }

        30% {
          transform: scaleX(.5) scaleY(0.05);
        }

        80% {
          transform: scaleX(.9) scaleY(0.5);
        }

        100% {
          transform: scaleX(1) scaleY(1);
        }
      }

      .screen {
        animation: crtTurnOn 250ms ease-in-out forwards;
        transform: scaleX(0) scaleY(0);
        will-change: transform;
      }
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.5;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      .page {
        animation: fadeIn 150ms ease-in-out forwards;
      }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div class="screen">
    <div class="page">
      <window-manager>
        <div id="sidebar" slot="waybar-right"></div>
        <div id="fullscreen" slot="waybar-right"></div>
        <div id="settings" slot="waybar-right"></div>
        <div id="display" slot="overlay" hidden></div>
      </window-manager>
      <div id="react"></div>
    </div>
  </div>
</body>

</html>
