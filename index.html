  <script>
    // Before first paint, so the boot animation honours the setting. Settings'
    // Animation toggle wins; until it's touched, follow the OS preference.
    try {
      var stored = localStorage.getItem("animation");
      var animate = stored === null ? !matchMedia("(prefers-reduced-motion: reduce)").matches : stored === "true";
      document.documentElement.classList.toggle("animation", animate);
    } catch (e) {}
  </script>
  <script>/*! coi-serviceworker v0.1.7 - Guido Zuidhof and contributors, licensed under MIT */
let coepCredentialless = false;
if (typeof window === 'undefined') {
    self.addEventListener("install", () => self.skipWaiting());
    self.addEventListener("activate", (event) => event.waitUntil(self.clients.claim()));

    self.addEventListener("message", (ev) => {
        if (!ev.data) {

                .unregister()
                .then(() => {
                    return self.clients.matchAll();

                .then(clients => {
                    clients.forEach((client) => client.navigate(client.url));
                });
        } else if (ev.data.type === "coepCredentialless") {
            coepCredentialless = ev.data.value;
        }
    });

    self.addEventListener("fetch", function (event) {
        const r = event.request;

            return;

            ? new Request(r, {

            fetch(request)
                .then((response) => {
                    if (response.status === 0) {
                        return response;
                    }

                    const newHeaders = new Headers(response.headers);
                    newHeaders.set("Cross-Origin-Embedder-Policy",
                        coepCredentialless ? "credentialless" : "require-corp"
                    );
                    if (!coepCredentialless) {
                        newHeaders.set("Cross-Origin-Resource-Policy", "cross-origin");
                    }
                    newHeaders.set("Cross-Origin-Opener-Policy", "same-origin");

                    return new Response(response.body, {
                        status: response.status,
                        statusText: response.statusText,
                        headers: newHeaders,
                    });
                })
                .catch((e) => console.error(e))
        );
    });

} else {
    (() => {
        // You can customize the behavior of this script through a global `coi` variable.
        const coi = {
            shouldRegister: () => true,
            shouldDeregister: () => false,
            coepCredentialless: () => !(window.chrome || window.netscape),
            doReload: () => window.location.reload(),
            quiet: false,
            ...window.coi
        };

        const n = navigator;

        if (n.serviceWorker && n.serviceWorker.controller) {
            n.serviceWorker.controller.postMessage({
                type: "coepCredentialless",
                value: coi.coepCredentialless(),
            });

            if (coi.shouldDeregister()) {
                n.serviceWorker.controller.postMessage({ type: "deregister" });

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Every duration is multiplied by --motion, which is 0 unless the
       Animation setting is on. It's a custom property, not a class check,
       so it reaches into shadow roots too. Animations still run at 0ms, so
       their end state (e.g. forwards fills) still applies.

       Legacy-terminal feel: state changes land in well under ~100ms (reads
       as instant), and motion uses linear or steps() rather than smooth
       easing, like a CRT redrawing. Only the one-off power-on lingers. */
    :root {
      --motion: 0;
      --duration-instant: calc(50ms * var(--motion));
      --duration-fast: calc(100ms * var(--motion));
      --duration-slow: calc(300ms * var(--motion));
    }

    :root.animation {
      --motion: 1;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    html {
      background-color: var(--background-color);
      color: var(--text-color);
    }

    body {
      position: relative;
      background-color: var(--background-color);
      color: var(--text-color);
      font-family: Consolas, "Courier New", Menlo, Monaco, "Liberation Mono", "Lucida Console", monospace;
      font-size: 16px;
      font-kerning: normal;
      font-variant-ligatures: none;

      text-shadow: var(--text-glow);
      text-wrap: pretty;
      word-break: break-word;
      text-rendering: optimizeLegibility;

      transform: translateZ(0);

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -moz-font-smoothing: antialiased;
      font-feature-settings: "kern" 1, "liga" 0;
      -webkit-font-feature-settings: "kern" 1, "liga" 0;
      -moz-font-feature-settings: "kern" 1, "liga" 0;
      font-smooth: always;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: inherit;
      transform-origin: center;
    }

    @keyframes crtTurnOn {
      0% {
        transform: scaleX(0) scaleY(0);
      }

      30% {
        transform: scaleX(.5) scaleY(0.05);
      }

      80% {
        transform: scaleX(.9) scaleY(0.5);
      }

      100% {
        transform: scaleX(1) scaleY(1);
      }
    }

    .screen {
      animation: crtTurnOn var(--duration-slow) steps(6, end) forwards;
      transform: scaleX(0) scaleY(0);
      will-change: transform;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.5;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .page {
      animation: fadeIn var(--duration-fast) linear forwards;
    }
  </style>
